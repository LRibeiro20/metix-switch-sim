name: Infrastructure CI (Terraform & Local Kubernetes)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-infra.yml"
  workflow_dispatch:

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform fmt, validate & TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize and run TFLint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive

  kubernetes-manifest-validate:
    name: Kustomize Render & Kubeconform Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate local and ci-kind Kustomize overlays
        run: |
          set -o pipefail
          for overlay in local ci-kind; do
            echo "==> Validating infra/k8s/overlays/${overlay}"
            kubectl kustomize "infra/k8s/overlays/${overlay}" \
              | kubeconform -strict -summary -output pretty
          done

  kind-cluster-e2e:
    name: Ephemeral kind Cluster E2E (Terraform + mTLS Transfer)
    runs-on: ubuntu-latest
    needs: [terraform-validate, kubernetes-manifest-validate]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metix-backend:local
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: metix-backend:local
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build metix-frontend:local
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: metix-frontend:local
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: metix-ci
          wait: 120s

      - name: Side-load local images into kind
        run: |
          kind load docker-image metix-backend:local --name metix-ci
          kind load docker-image metix-frontend:local --name metix-ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Provision METIX Switch stack via Terraform (ci-kind overlay)
        run: |
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform apply -auto-approve -input=false \
            -var="kube_context=kind-metix-ci" \
            -var="kustomize_overlay=ci-kind"

      - name: Verify all StatefulSets and Deployments are ready
        run: |
          for sts in postgres bci-postgres stdb-postgres redis; do
            kubectl --context kind-metix-ci -n metix-switch rollout status "statefulset/${sts}" --timeout=180s
          done
          kubectl --context kind-metix-ci -n metix-switch get pods,svc,pvc,networkpolicies -o wide

      - name: Run mTLS interbank transfer & PKI smoke test
        run: |
          kubectl --context kind-metix-ci -n metix-switch port-forward svc/switch-api 8000:8000 >/tmp/pf-api.log 2>&1 &
          PF_API=$!
          kubectl --context kind-metix-ci -n metix-switch port-forward svc/frontend 3000:3000 >/tmp/pf-ui.log 2>&1 &
          PF_UI=$!
          trap "kill ${PF_API} ${PF_UI} 2>/dev/null || true" EXIT

          python3 scripts/k8s-smoke-test.py

      - name: Verify clean Terraform destroy
        run: |
          terraform -chdir=infra/terraform destroy -auto-approve -input=false \
            -var="kube_context=kind-metix-ci" \
            -var="kustomize_overlay=ci-kind"

      - name: Collect Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-metix-ci -n metix-switch get all,pvc,events --sort-by=.lastTimestamp || true
          for pod in $(kubectl --context kind-metix-ci -n metix-switch get pods -o name 2>/dev/null); do
            echo "=== Logs for ${pod} ==="
            kubectl --context kind-metix-ci -n metix-switch logs "${pod}" --all-containers --tail=100 || true
          done
