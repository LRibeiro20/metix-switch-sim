# Next.js 15 banking operations dashboard. NEXT_PUBLIC_API_URL is baked at image
# build time (http://localhost:8000); the local overlay exposes switch-api on
# localhost:8000 via a LoadBalancer so the browser can reach it unchanged.
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: dashboard
    spec:
      initContainers:
        - name: wait-for-switch-api
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O /dev/null http://switch-api:8000/health; do echo "waiting for switch-api"; sleep 3; done
      containers:
        - name: frontend
          image: metix-frontend:local
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: NEXT_PUBLIC_API_URL, value: "http://localhost:8000" }
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 1000m, memory: 768Mi }
