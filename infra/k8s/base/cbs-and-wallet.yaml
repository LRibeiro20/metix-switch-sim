apiVersion: v1
kind: Service
metadata:
  name: wallet-sim
  labels:
    app.kubernetes.io/name: wallet-sim
    app.kubernetes.io/component: mobile-wallet
spec:
  selector:
    app.kubernetes.io/name: wallet-sim
  ports:
    - name: https-mtls
      port: 8446
      targetPort: https-mtls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-sim
  labels:
    app.kubernetes.io/name: wallet-sim
    app.kubernetes.io/component: mobile-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-sim
        app.kubernetes.io/component: mobile-wallet
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 redis 6379; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: wallet-sim
          image: metix-backend:local
          command: ["uv", "run", "--no-dev", "python", "-m", "wallet_sim.run_server"]
          ports:
            - name: https-mtls
              containerPort: 8446
          env:
            - { name: WALLET_SERVICE_ID, value: wallet-sim }
            - { name: WALLET_PORT, value: "8446" }
            - { name: WALLET_REDIS_URL, value: "redis://redis:6379/0" }
            - { name: WALLET_CERTS_DIR, value: /certs }
            - { name: WALLET_MTLS_ENABLED, value: "true" }
            - { name: WALLET_REQUIRE_SIGNED_REQUESTS, value: "true" }
            - name: WALLET_JWT_SECRET
