# Independent Core Banking Simulators (BCI, Standard Bank) and the Mobile Wallet
# Adapter simulator. All three terminate strict mTLS (ssl.CERT_REQUIRED), so
# plain httpGet probes cannot be used — exec probes present the switch-api
# client certificate, exactly like the docker-compose healthchecks.
---
apiVersion: v1
kind: Service
metadata:
  name: bci-cbs
  labels:
    app.kubernetes.io/name: bci-cbs
    app.kubernetes.io/component: core-banking
spec:
  selector:
    app.kubernetes.io/name: bci-cbs
  ports:
    - name: https-mtls
      port: 8444
      targetPort: https-mtls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bci-cbs
  labels:
    app.kubernetes.io/name: bci-cbs
    app.kubernetes.io/component: core-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bci-cbs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bci-cbs
        app.kubernetes.io/component: core-banking
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 bci-postgres 5432; do echo "waiting for bci-postgres"; sleep 2; done
              until nc -z -w 2 redis 6379; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: bci-cbs
          image: metix-backend:local
          command: ["uv", "run", "--no-dev", "python", "-m", "cbs.run_server"]
          ports:
            - name: https-mtls
              containerPort: 8444
          env:
            - { name: CBS_BANK_CODE, value: BCI_MZ }
            - { name: CBS_BANK_NAME, value: Banco Comercial e de Investimentos }
            - { name: CBS_BIC_CODE, value: CGDIMZMA }
            - { name: CBS_SERVICE_ID, value: bci-cbs }
            - { name: CBS_PORT, value: "8444" }
            - { name: CBS_REDIS_URL, value: "redis://redis:6379/0" }
            - { name: CBS_CERTS_DIR, value: /certs }
            - { name: CBS_MTLS_ENABLED, value: "true" }
            - { name: CBS_REQUIRE_SIGNED_REQUESTS, value: "true" }
            - name: CBS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: metix-db-credentials, key: bci-url }
            - name: CBS_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: metix-app-secrets, key: JWT_SECRET }
            - name: CBS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: metix-app-secrets, key: ENCRYPTION_KEY }
            - name: CBS_SIGNING_MASTER_SEED
              valueFrom:
                secretKeyRef: { name: metix-app-secrets, key: SIGNING_MASTER_SEED }
          readinessProbe: &cbs-bci-probe
            exec:
              command:
                - python
                - -c
                - >-
                  import ssl, urllib.request;
                  ctx = ssl.create_default_context(cafile='/certs/ca.crt');
                  ctx.load_cert_chain('/certs/switch-api.crt', '/certs/switch-api.key');
                  urllib.request.urlopen('https://localhost:8444/cbs/v1/health', context=ctx, timeout=4)
            initialDelaySeconds: 10
            periodSeconds: 6
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            <<: *cbs-bci-probe
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 1000m, memory: 768Mi }
          volumeMounts:
            - name: pki
              mountPath: /certs
              readOnly: true
      volumes:
        - name: pki
          secret:
            secretName: metix-pki-certs
            defaultMode: 0440
---
