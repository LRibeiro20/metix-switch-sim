                  ctx.load_cert_chain('/certs/switch-api.crt', '/certs/switch-api.key');
                  urllib.request.urlopen('https://localhost:8446/wallet/v1/health', context=ctx, timeout=4)
            initialDelaySeconds: 10
            periodSeconds: 6
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            <<: *wallet-probe
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          volumeMounts:
            - name: pki
              mountPath: /certs
              readOnly: true
      volumes:
        - name: pki
          secret:
            secretName: metix-pki-certs
            defaultMode: 0440
